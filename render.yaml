# Render Blueprint for B2B Lead Platform
# Deploy: https://render.com/docs/blueprint-spec

services:
  # Backend API Service
  - type: web
    name: b2b-lead-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
        # Set this in Render dashboard to your Neon or Render database URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        # Set this to your frontend URL after deploying frontend
        value: https://b2b-lead-frontend.onrender.com

  # Frontend Static Site
  - type: web
    name: b2b-lead-frontend
    runtime: docker
    dockerfilePath: ./client/Dockerfile
    plan: starter
    envVars:
      - key: VITE_API_URL
        # Update this to your backend URL after deploying backend
        value: https://b2b-lead-backend.onrender.com

# Optional: Create a PostgreSQL database on Render
databases:
  - name: b2b-lead-database
    plan: starter
    databaseName: leadplatform
    user: admin
