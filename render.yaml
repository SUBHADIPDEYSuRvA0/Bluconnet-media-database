# Render Blueprint for B2B Lead Platform
# Deploy: https://render.com/docs/blueprint-spec
#
# IMPORTANT: Use "Blueprint" deployment method in Render Dashboard
# Do NOT use manual Docker deployment - this config uses Node.js runtime

services:
  # Backend API Service (Node.js)
  - type: web
    name: bluconnet-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: cd server && npm ci && npx prisma generate && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
        # Set this in Render dashboard to your Neon or Render database URL
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        # Set this to the deployed Vercel frontend URL in Render after deployment.
        sync: false

  # Frontend Static Site
  - type: web
    name: bluconnet-frontend
    runtime: static
    buildCommand: cd client && npm ci && npm run build
    staticPublishPath: ./client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://bluconnet-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        # Update this to your backend URL after deploying backend
        value: https://bluconnet-backend.onrender.com

# Production database is Neon PostgreSQL. Set DATABASE_URL in Render.
